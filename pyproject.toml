[project]
name = "oscar-portfolio"
version = "0.1.0"
description = "Python portfolio project"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flask==3.0.0",
    "gunicorn==21.2.0",
    "jinja2>=3.1.6,<4",
    "markdown-it-py>=3,<5",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.0.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
