name: Portfolio infrastructure

on:
  workflow_dispatch:
    inputs:
      delivery:
        description: Keep delivery unchanged, enable it, or disable it
        type: choice
        options: [preserve, enable, disable]
        default: preserve

permissions:
  contents: read

concurrency:
  group: portfolio-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: oscar-portfolio
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  plan:
    name: Create change set
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      change_set: ${{ steps.plan.outputs.change_set }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
      change_type: ${{ steps.plan.outputs.change_type }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.13"

      - name: Validate template
        run: uv tool run --from cfn-lint==1.59.0 cfn-lint infra/portfolio.yml

      - name: Authenticate for planning
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_INFRA_PLAN_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          unset-current-credentials: true

      - name: Create and summarize change set
        id: plan
        shell: bash
        env:
          DELIVERY: ${{ inputs.delivery }}
          PROVIDER_ARN: ${{ vars.AWS_GITHUB_PROVIDER_ARN }}
          BOUNDARY_ARN: ${{ vars.AWS_DEPLOY_BOUNDARY_ARN }}
        run: |
          set -euo pipefail
          : "${AWS_ACCOUNT_ID:?Set repository AWS_ACCOUNT_ID}"
          : "${PROVIDER_ARN:?Set repository AWS_GITHUB_PROVIDER_ARN}"
          : "${BOUNDARY_ARN:?Set repository AWS_DEPLOY_BOUNDARY_ARN}"
          change_type=UPDATE
          if ! aws cloudformation describe-stacks --stack-name "$STACK_NAME" > stack.json 2> stack-error.txt; then
            if grep -q 'does not exist' stack-error.txt; then
              change_type=CREATE
            else
              cat stack-error.txt >&2
              exit 1
            fi
          fi
          if [[ "$change_type" == UPDATE ]] && jq -e '.Stacks[0].StackStatus == "REVIEW_IN_PROGRESS"' stack.json > /dev/null; then
            change_type=CREATE
          fi
          ENABLE_DELIVERY=false
          if [[ "$change_type" == UPDATE ]]; then
            ENABLE_DELIVERY=$(jq -r '.Stacks[0].Parameters[] | select(.ParameterKey == "EnableDelivery") | .ParameterValue' stack.json)
          fi
          case "$DELIVERY" in
            enable) ENABLE_DELIVERY=true ;;
            disable) ENABLE_DELIVERY=false ;;
          esac
          if [[ "$ENABLE_DELIVERY" == true ]]; then
            plan_arn=$(jq -r '.Stacks[0].Outputs[] | select(.OutputKey == "FreePlanArn") | .OutputValue' stack.json)
            : "${plan_arn:?Create the stack with delivery disabled first}"
            aws pricing-plan-manager get-subscription --arn "$plan_arn" > subscription.json
            jq -e '.subscription | .planTier == "FREE" and (.currentPlanTier // .planTier) == "FREE" and .status == "ACTIVE"' subscription.json
          fi
          change_set=$(aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" --change-set-name "portfolio-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --change-set-type "$change_type" --template-body file://infra/portfolio.yml \
            --description "Portfolio infrastructure ${GITHUB_SHA}" --capabilities CAPABILITY_IAM \
            --parameters \
              "ParameterKey=ExpectedAccountId,ParameterValue=$AWS_ACCOUNT_ID" \
              "ParameterKey=ExistingGitHubProviderArn,ParameterValue=$PROVIDER_ARN" \
              "ParameterKey=DeployPermissionsBoundaryArn,ParameterValue=$BOUNDARY_ARN" \
              "ParameterKey=EnableDelivery,ParameterValue=$ENABLE_DELIVERY" \
            --query Id --output text)
          echo "change_set=$change_set" >> "$GITHUB_OUTPUT"
          echo "change_type=$change_type" >> "$GITHUB_OUTPUT"
          if ! aws cloudformation wait change-set-create-complete --change-set-name "$change_set"; then
            aws cloudformation describe-change-set --change-set-name "$change_set" > change-set.json
            if jq -e --arg reason "didn't contain changes" '.Status == "FAILED" and (.StatusReason | contains($reason) or contains("did not contain changes"))' change-set.json; then
              echo 'has_changes=false' >> "$GITHUB_OUTPUT"
              echo 'No infrastructure changes to apply.' >> "$GITHUB_STEP_SUMMARY"
              aws cloudformation delete-change-set --change-set-name "$change_set"
              exit 0
            fi
            cat change-set.json >&2
            exit 1
          fi
          aws cloudformation describe-change-set --change-set-name "$change_set" > change-set.json
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          {
            echo "## Review infrastructure changes"
            echo "Commit $GITHUB_SHA"
            echo
            echo '| Action | Resource | Type | Replacement |'
            echo '| --- | --- | --- | --- |'
            jq -r '.Changes[].ResourceChange | "| \(.Action) | \(.LogicalResourceId) | \(.ResourceType) | \(.Replacement // "—") |"' change-set.json
            echo
            echo "[Review in AWS](https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/changeset/detail?changeSetId=$change_set)"
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Approve and apply
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: infrastructure-production
    concurrency:
      group: portfolio-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate after approval
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_INFRA_APPLY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 7200
          unset-current-credentials: true

      - name: Execute the reviewed change set
        shell: bash
        env:
          CHANGE_SET: ${{ needs.plan.outputs.change_set }}
          CHANGE_TYPE: ${{ needs.plan.outputs.change_type }}
        run: |
          set -euo pipefail
          aws cloudformation execute-change-set --stack-name "$STACK_NAME" --change-set-name "$CHANGE_SET"
          if [[ "$CHANGE_TYPE" == CREATE ]]; then
            aws cloudformation wait stack-create-complete --stack-name "$STACK_NAME"
          else
            aws cloudformation wait stack-update-complete --stack-name "$STACK_NAME"
          fi
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" > stack.json
          plan_arn=$(jq -r '.Stacks[0].Outputs[] | select(.OutputKey == "FreePlanArn") | .OutputValue' stack.json)
          aws pricing-plan-manager get-subscription --arn "$plan_arn" > subscription.json
          jq -e '.subscription | .planTier == "FREE" and (.currentPlanTier // .planTier) == "FREE" and .status == "ACTIVE"' subscription.json
          {
            echo '## Infrastructure updated'
            echo
            jq -r '.Stacks[0].Outputs[] | "- **\(.OutputKey)** \(.OutputValue)"' stack.json
          } >> "$GITHUB_STEP_SUMMARY"
