name: Portfolio CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.13"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint portfolio code
        run: |
          uv run --locked ruff check scripts/build.py scripts/serve.py tests/test_build.py tests/test_serve.py
          uv run --locked ruff format --check scripts/build.py scripts/serve.py tests/test_build.py tests/test_serve.py

      - name: Run tests
        run: uv run --locked pytest -q

      - name: Build static portfolio and check links
        run: uv run --locked python scripts/build.py

      - name: Save site artifact
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
