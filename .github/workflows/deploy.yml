name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the built image to the configured production server
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Check deployment failure handling
        shell: bash
        run: bash tests/deploy.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish app image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./webapp
          file: ./webapp/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Changing a server requires a manual run on main.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      APP_IMAGE: ${{ needs.build.outputs.image }}
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SERVER_PATH: ${{ vars.SERVER_PATH }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure SSH and validate settings
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SERVER_HOST:?Set production variable SERVER_HOST}"
          : "${SERVER_USER:?Set production variable SERVER_USER}"
          : "${SERVER_PATH:?Set production variable SERVER_PATH}"
          : "${SERVER_SSH_KEY:?Set production secret SERVER_SSH_KEY}"
          : "${SERVER_KNOWN_HOSTS:?Set production secret SERVER_KNOWN_HOSTS}"
          [[ "$SERVER_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SERVER_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$SERVER_PORT" =~ ^[0-9]+$ ]] && (( SERVER_PORT >= 1 && SERVER_PORT <= 65535 ))
          [[ "$SERVER_PATH" =~ ^(/[a-zA-Z0-9_-]+)+$ ]]
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Transfer deployment files and update the app
        shell: bash
        run: |
          set -euo pipefail
          printf -v remote_command 'mkdir -p -- %q && tar -xf - -C %q && cd -- %q && bash scripts/deploy.sh %q' \
            "$SERVER_PATH" "$SERVER_PATH" "$SERVER_PATH" "$APP_IMAGE"
          tar -cf - docker-compose.production.yml db/init.sql scripts/deploy.sh | \
            ssh -i "$HOME/.ssh/deploy_key" -p "$SERVER_PORT" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 "$SERVER_USER@$SERVER_HOST" "$remote_command"

      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: rm -f -- "$HOME/.ssh/deploy_key"
