name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the built image to the configured production server
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.13"

      - name: Install locked dependencies and check pages
        run: |
          uv sync --locked
          uv run --locked pytest -q

      - name: Check deployment failure handling
        run: bash tests/deploy.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish app image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./webapp/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Changing a server requires a manual run on main.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production-deploy
    env:
      APP_IMAGE: ${{ needs.build.outputs.image }}
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SERVER_PATH: ${{ vars.SERVER_PATH }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Deploy over SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SERVER_HOST:?Set production variable SERVER_HOST}"
          : "${SERVER_USER:?Set production variable SERVER_USER}"
          : "${SERVER_PATH:?Set production variable SERVER_PATH}"
          : "${SERVER_SSH_KEY:?Set production secret SERVER_SSH_KEY}"
          : "${SERVER_KNOWN_HOSTS:?Set production secret SERVER_KNOWN_HOSTS}"
          [[ "$SERVER_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SERVER_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          if ! [[ "$SERVER_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( SERVER_PORT > 65535 )); then
            echo 'SERVER_PORT must be an integer between 1 and 65535.' >&2
            exit 1
          fi
          [[ "$SERVER_PATH" =~ ^(/[a-zA-Z0-9_-]+)+$ ]]
          umask 077
          trap 'rm -f -- "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_known_hosts"' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy_known_hosts"
          printf -v remote_command 'mkdir -p -- %q && tar -xf - -C %q && cd -- %q && bash scripts/deploy.sh %q' \
            "$SERVER_PATH" "$SERVER_PATH" "$SERVER_PATH" "$APP_IMAGE"
          tar -cf - docker-compose.production.yml db/init.sql scripts/deploy.sh | \
            ssh -i "$RUNNER_TEMP/deploy_key" -p "$SERVER_PORT" \
              -o "UserKnownHostsFile=$RUNNER_TEMP/deploy_known_hosts" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 "$SERVER_USER@$SERVER_HOST" "$remote_command"
