# Production runs the published image, without development source mounts.
name: ${COMPOSE_PROJECT_NAME:?Set the existing Compose project name in .env}

services:
  webapp:
    image: ${APP_IMAGE:?Set the published image digest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 15s

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
    # Require the existing volume explicitly instead of silently creating one.
    external: true
    name: ${POSTGRES_VOLUME:?Set the existing database volume name in .env}
