# A separate, disposable design preview. It never starts the real database.
services:
  preview:
    build: ./webapp
    command: [python, -u, /preview/preview.py]
    init: true
    restart: "no"
    ports:
      - "127.0.0.1:5055:5055"
    environment:
      PREVIEW_DURATION_SECONDS: ${PREVIEW_DURATION_SECONDS:-1800}
    volumes:
      - ./scripts/preview.py:/preview/preview.py:ro
      - ./webapp/templates:/app/templates:ro
      - ./webapp/static:/app/static:ro
