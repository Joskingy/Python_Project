<!DOCTYPE html>
<html lang="en" class="{{ 'dark-mode' if dark_mode else '' }}">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --btn-bg: #0d6efd;
            --btn-hover: #0b5ed7;
        }
        .dark-mode {
            --bg-color: #121212;
            --text-color: #ffffff;
            --btn-bg: #1976d2;
            --btn-hover: #1565c0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        .btn-primary {
            background-color: var(--btn-bg);
            border-color: var(--btn-bg);
        }
        .btn-primary:hover {
            background-color: var(--btn-hover);
            border-color: var(--btn-hover);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">User App</a>
            <button class="btn btn-outline-dark" onclick="location.href='{{ url_for('toggle_dark_mode') }}'">
                {{ 'Light Mode' if dark_mode else 'Dark Mode' }}
            </button>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
